# coturn config for the TV Hub Pi: a TURN relay for WebRTC on the local
# network. Used when the phone and a watching device can't connect directly
# (another subnet, guest Wi-Fi with client isolation, a browser that can't
# resolve the other side's hidden .local address). The video is end-to-end
# encrypted by WebRTC either way; coturn only forwards packets.
#
# Install on the Pi: see deploy/README.md.

listening-port=3478
# Relay ports, kept small: a handful of streams at most.
min-port=49160
max-port=49200

# Short-lived credentials made by the TV Hub server (GET /api/ice) from this
# shared secret. Put the same value in server/.env as TURN_SECRET.
use-auth-secret
static-auth-secret=CHANGE_ME
realm=tv-hub

fingerprint
# Keep the admin CLI off. Older coturn (Raspberry Pi OS apt) turns it on by
# default; newer coturn logs "no-cli option is deprecated", which is harmless.
no-cli
no-tls
no-dtls
no-multicast-peers
# Each credential may hold a few relays; the whole server a few dozen.
user-quota=12
total-quota=48

# Only relay to devices on the local network. Without this a TURN server
# can be used to reach the internet, or services on the Pi itself, through
# it. allowed-peer-ip lines take precedence over denied-peer-ip.
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
# Loopback stays blocked, so the relay can't reach services that listen only
# on the Pi itself. (Its LAN address is reachable, as it is to any LAN device.)
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

simple-log
